name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Tests (pytest + Spark local)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=reports/junit.xml
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            reports/junit.xml
            coverage.xml

  plateforme:
    name: Validation docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe du docker-compose (lot 1)
        run: |
          if [ -f docker/docker-compose.yml ]; then
            docker compose -f docker/docker-compose.yml config --quiet
            echo "docker-compose valide"
          else
            echo "Pas encore de docker/docker-compose.yml : étape ignorée (lot 1 à venir)"
          fi
