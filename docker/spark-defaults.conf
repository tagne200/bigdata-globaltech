# Configuration Spark par défaut du cluster GlobalTech (lot 1, BG-20).
# Montée dans le client Spark et dans le Spark History Server.

# Les jobs s'exécutent sur YARN ; le driver reste dans le conteneur spark-client.
spark.master                          yarn
spark.submit.deployMode               client
spark.driver.host                     spark-client
spark.driver.memory                   1g

# Exécuteurs dimensionnés pour 2 NodeManagers de 2 Go (à ajuster au lot 7, mesures à l'appui).
spark.executor.instances              2
spark.executor.cores                  1
spark.executor.memory                 512m
spark.yarn.am.memory                  512m

# Historique des jobs : écrit dans HDFS, lu par le Spark History Server.
spark.eventLog.enabled                true
spark.eventLog.dir                    hdfs://namenode:8020/spark-logs
spark.history.fs.logDirectory         hdfs://namenode:8020/spark-logs
spark.history.fs.update.interval      10s
spark.yarn.historyServer.address      spark-history:18080

# Règle de gestion du cadrage : fuseau Europe/Paris.
spark.sql.session.timeZone            Europe/Paris

# Même Python partout (driver et exécuteurs).
spark.pyspark.python                  python3
spark.pyspark.driver.python           python3
