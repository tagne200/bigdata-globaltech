[project]
name = "bigdata-globaltech"
version = "0.1.0"
description = "Plateforme Big Data GlobalTech - Hadoop (HDFS, YARN), Spark 3.5, Docker"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
# Fichiers fournis par l'enseignant, laissés tels quels
extend-exclude = ["tools/stream_replay.py", "src/main.py"]

[tool.ruff.lint]
# E/F : erreurs de base, I : ordre des imports, B : bugs courants, UP : syntaxe moderne
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["src/bigdata"]
